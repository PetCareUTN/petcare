services:
  postgres:
    image: postgres:16
    container_name: petcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare_user
      POSTGRES_PASSWORD: petcare_password
    ports:
      - "5432:5432"
    volumes:
      - petcare_postgres_data:/var/lib/postgresql/data

volumes:
  petcare_postgres_data: