<main class="ap-page">
  <header class="ap-header">
    <div>
      <h1>Alta asistida de dueño</h1>
      <p>Crea una cuenta para un responsable que todavía no usa PetCare.</p>
    </div>
    <a class="ap-btn ap-btn-soft" routerLink="/eventos-clinicos">Volver a atención</a>
  </header>

  @if (successMessage()) {
    <p class="ap-banner ap-banner-success" role="status">{{ successMessage() }}</p>
  }

  @if (errorMessage()) {
    <p class="ap-banner ap-banner-error" role="alert">{{ errorMessage() }}</p>
  }

  <form class="ap-grid" [formGroup]="form" (ngSubmit)="submit()">
    <section class="ap-panel" aria-labelledby="datos-personales">
      <h2 id="datos-personales">Datos del responsable</h2>

      <div class="ap-fields">
        <label class="ap-field">
          Nombre
          <input type="text" formControlName="nombre" autocomplete="given-name" />
          @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
            <span class="ap-error">Ingresá un nombre de hasta 100 caracteres.</span>
          }
        </label>

        <label class="ap-field">
          Apellido
          <input type="text" formControlName="apellido" autocomplete="family-name" />
          @if (form.controls.apellido.touched && form.controls.apellido.invalid) {
            <span class="ap-error">El apellido no puede superar los 100 caracteres.</span>
          }
        </label>

        <label class="ap-field ap-wide">
          DNI
          <input type="text" formControlName="numeroDocumento" inputmode="numeric" autocomplete="off" />
          @if (form.controls.numeroDocumento.touched && form.controls.numeroDocumento.invalid) {
            <span class="ap-error">Ingresá un DNI válido, solo con números.</span>
          }
        </label>
      </div>
    </section>

    <section class="ap-panel" aria-labelledby="datos-contacto">
      <h2 id="datos-contacto">Contacto</h2>
      <p class="ap-panel-sub">El sistema enviará un email para que defina su contraseña.</p>

      <div class="ap-fields">
        <label class="ap-field ap-wide">
          Email
          <input type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="ap-error">Ingresá un email valido.</span>
          }
        </label>

        <label class="ap-field ap-wide">
          Teléfono
          <input type="tel" formControlName="telefono" autocomplete="tel" />
          @if (form.controls.telefono.touched && form.controls.telefono.invalid) {
            <span class="ap-error">El teléfono no puede superar los 30 caracteres.</span>
          }
        </label>
      </div>

      <button type="submit" class="ap-btn ap-btn-primary ap-panel-action" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando cuenta...' : 'Crear cuenta y enviar email' }}
      </button>
    </section>
  </form>
</main>
