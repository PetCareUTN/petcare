<button
  type="button"
  class="btn-mic"
  [class.grabando]="dictado.estaGrabando(campo())"
  [attr.aria-pressed]="dictado.estaGrabando(campo())"
  [attr.aria-label]="(dictado.estaGrabando(campo()) ? 'Detener dictado de ' : 'Dictar ') + etiqueta()"
  [title]="dictado.estaGrabando(campo()) ? 'Detener dictado' : 'Dictar en este campo'"
  (click)="alternar()"
>
  <svg class="icono-mic" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"
    />
  </svg>
  {{ dictado.estaGrabando(campo()) ? 'Grabando...' : 'Dictar' }}
</button>
@if (dictado.errorDe(campo()); as error) {
  <span class="mic-error" role="alert">{{ error }}</span>
}
