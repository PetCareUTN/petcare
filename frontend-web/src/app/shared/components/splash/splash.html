<div class="splash" [class.is-leaving]="isLeaving()" role="presentation">
  <div class="splash-content">
    <div class="splash-logo-wrapper">
      <span class="splash-halo"></span>
      <img class="splash-logo" src="/logo.jpg" alt="" aria-hidden="true" />
    </div>

    <p class="splash-title">
      <span class="splash-letter" style="--i: 0">P</span>
      <span class="splash-letter" style="--i: 1">e</span>
      <span class="splash-letter" style="--i: 2">t</span>
      <span class="splash-letter" style="--i: 3">C</span>
      <span class="splash-letter" style="--i: 4">a</span>
      <span class="splash-letter" style="--i: 5">r</span>
      <span class="splash-letter" style="--i: 6">e</span>
    </p>

    <span class="splash-underline"></span>
  </div>
</div>
