<div class="vet-shell">
  <aside class="vet-sidebar">
    <div class="vet-brand">
      <img class="vet-brand-logo" src="logo.jpg" alt="PetCare" />
      <div>
        <p class="vet-brand-title">PetCare Vet</p>
        <p class="vet-brand-subtitle">Plataforma clínica</p>
      </div>
    </div>

    <nav class="vet-nav">
      <a routerLink="/eventos-clinicos" [class.active]="isAttentionActive()">
        Atención veterinaria
      </a>
      <a
        routerLink="/eventos-clinicos/disponibilidad"
        [class.active]="isDisponibilidadActive()"
      >
        Disponibilidad
      </a>
      <a routerLink="/servicios" [class.active]="isServiciosActive()"> Mis servicios </a>
    </nav>

    <button type="button" class="vet-logout" (click)="logout()">Cerrar sesión</button>
  </aside>

  <main class="vet-content">
    <router-outlet />
  </main>
</div>
